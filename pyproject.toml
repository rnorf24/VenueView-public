[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venueview-core"
version = "1.0.0-rc.3"
description = "Privacy-conscious calendar processing for venue operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "python-dateutil>=2.9,<3",
  "openpyxl>=3.1,<4",
  "tzdata>=2024.1",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]
build = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
venueview = "venueview.cli:main"
venueview-ui = "venueview.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
